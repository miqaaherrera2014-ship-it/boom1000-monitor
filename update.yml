name: Actualizar Boom 1000 desde Deriv
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: boom1000-market-data
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente WebSocket
        run: python -m pip install 'websockets>=13,<17'
      - name: Verificar simbolo y recuperar velas
        run: python src/deriv_snapshot.py
      - name: Publicar snapshot solo si se verifico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar datos verificados Boom 1000'
            git push
          fi
